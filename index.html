var state = { cat: '', site: '', sort: 'desc' };
var SITE_ICON = {'美国':'🇺🇸','中东拉美澳新':'🌍','欧区':'🇪🇺'};

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtRatio(r){ return (r*100).toFixed(1); }

// watermark
(function(){
  var wm=document.getElementById('wm'); var text='纹身贴&面部装饰贴M9W3高增速选品参考｜欢迎联系迢之 VX：tiaozhiovo';
  var html=''; for(var i=0;i<22;i++){ var x=(i*97)%120-20; var y=i*140+20; html+='<div class="wm-line" style="left:'+x+'%;top:'+(y%1600)+'px">'+esc(text)+'</div>'; }
  wm.innerHTML=html;
})();

function renderTabs(){
  var el=document.getElementById('tabs'); el.innerHTML='';
  var all = CATS.reduce(function(a,c){return a+c.total;},0);
  function mk(label,cnt){
    var b=document.createElement('button'); b.className='tab'+((state.cat===(label==='全部'?'':label))?' active':''); 
    if(label==='全部') b.className='tab'+((state.cat==='')?' active':'');
    b.innerHTML=esc(label)+' <span class="cnt">'+cnt+'</span>';
    b.onclick=function(){ state.cat=(label==='全部'?'':label); render(); };
    el.appendChild(b);
  }
  mk('全部', all);
  CATS.forEach(function(c){ mk(c.label, c.total); });
  document.getElementById('mt-tattoo').textContent=CATS[0].total;
  document.getElementById('mt-face').textContent=CATS[1].total;
}

function activeCats(){
  return state.cat ? CATS.filter(function(c){return c.label===state.cat;}) : CATS;
}

function render(){
  renderTabs();
  var main=document.getElementById('main'); var html='';
  var shownTotal=0;
  activeCats().forEach(function(cat){
    var catCount=0;
    var siteHtml='';
    cat.sites.forEach(function(s){
      if(state.site && s.name!==state.site) return;
      var items=s.items.slice();
      if(state.sort==='asc') items.sort(function(a,b){return a.ratio-b.ratio;});
      if(items.length===0) return;
      catCount+=items.length;
      var cards='';
      items.forEach(function(it,idx){
        var badge='<span class="badge green"><span class="up">↑</span>'+fmtRatio(it.ratio)+'%</span>';
        cards+='<div class="card" data-u="'+esc(it.url)+'" data-cat="'+esc(cat.label)+'" data-site="'+esc(s.name)+'" data-r="'+fmtRatio(it.ratio)+'">'
          +'<div class="imgbox"><img loading="lazy" src="'+esc(it.url)+'" alt="'+esc(cat.label)+'" referrerpolicy="no-referrer"></div>'
          +'<div class="body"><div class="cat">'+esc(cat.label)+'</div>'
          +'<div class="sitepill">'+SITE_ICON[s.name]+' '+esc(s.name)+'</div>'
          +'<div class="row">'+badge+'<span class="rank">第'+(idx+1)+'名</span></div></div></div>';
      });
      siteHtml+='<div class="site-title"><span class="s-ico">'+SITE_ICON[s.name]+'</span><span class="s-name">'+esc(s.name)+'</span><span class="s-cnt">'+items.length+' 款</span></div><div class="grid">'+cards+'</div>';
    });
    if(catCount===0) return;
    shownTotal+=catCount;
    html+='<div class="sec-title"><h2><span class="ico">'+cat.icon+'</span>'+esc(cat.label)+'<span style="font-size:14px;color:var(--muted);margin-left:10px;font-weight:600">'+catCount+' 款</span></h2><div class="sub">'+esc(cat.hier)+'</div></div>'+siteHtml;
  });
  if(shownTotal===0) html='<div class="empty">当前筛选条件下暂无高增速商品。</div>';
  main.innerHTML=html;
  document.getElementById('rangeInfo').textContent='当前共 '+shownTotal+' 款高增速商品';
  bindCards();
}

function bindCards(){
  document.querySelectorAll('.card').forEach(function(c){
    c.onclick=function(){ openLb(c.getAttribute('data-u'), c.getAttribute('data-cat')+' · '+SITE_ICON[c.getAttribute('data-site')]+' '+c.getAttribute('data-site'), c.getAttribute('data-r')); };
  });
}

var lb=document.getElementById('lb');
function openLb(url,cat,r){ document.getElementById('lbImg').src=url; document.getElementById('lbCat').textContent=cat+' · 环比 +'+r+'%'; document.getElementById('lbSub').textContent='高增速选品参考'; document.getElementById('lbOpen').href=url; lb.classList.add('show'); }
function closeLb(){ lb.classList.remove('show'); }
document.getElementById('lbClose').onclick=closeLb; document.getElementById('lbClose2').onclick=closeLb;
lb.addEventListener('click',function(e){ if(e.target===lb) closeLb(); });
document.getElementById('lbCopy').onclick=function(){
  var url=document.getElementById('lbImg').src;
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){alert('已复制图片链接');},function(){prompt('复制失败，请手动复制：',url);}); }
  else{ prompt('复制失败，请手动复制：',url); }
};

var toTop=document.getElementById('toTop');
window.addEventListener('scroll',function(){ if(window.scrollY>400){toTop.classList.add('show');}else{toTop.classList.remove('show');} });
toTop.onclick=function(){ window.scrollTo({top:0,behavior:'smooth'}); };

document.getElementById('siteFilter').onchange=function(){ state.site=this.value; render(); };
document.getElementById('sortSel').onchange=function(){ state.sort=this.value; render(); };

render();
</script>
</body>
</html>
